<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>corcho — mis notas</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2B241C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="corcho">
<link rel="icon" type="image/png" href="/logocorcho.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header>
  <div class="brand">
    <h1>🧷 corcho</h1>
    <span>mis notas, clavadas acá</span>
  </div>
  <div class="spacer"></div>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="search" placeholder="Buscar en mis notas…" />
  </div>
  <button class="btn ghost" id="pushBtn" style="display:none" title="Avisos de recordatorios en este dispositivo">🔕</button>
  <button class="btn ghost" id="themeToggle" title="Cambiar tema">🌙</button>
  <button class="btn ghost" id="exportBtn" title="Descargar un backup de todas las notas">Backup</button>
  <button class="btn ghost" id="importBtn" title="Restaurar notas desde un backup">Importar</button>
  <button class="btn accent" id="addBtn">+ Nueva nota</button>
  <div class="user" id="userBox" style="display:none">
    <img id="userAvatar" alt="">
    <span id="userName"></span>
    <a href="/logout" id="logoutLink" title="Cerrar sesión">Salir</a>
  </div>
</header>

<main>
  <div class="topinfo">
    <div class="count" id="count"></div>
    <div class="filters" id="filters">
      <button class="chip" id="hideDoneBtn" title="Mostrar u ocultar las notas marcadas como hechas">Ocultar hechas</button>
      <span id="tagChips"></span>
    </div>
  </div>
  <div class="canvas-viewport" id="viewport">
    <div class="canvas-world" id="world"></div>
  </div>
  <div class="empty" id="emptyState" style="display:none">
    <h2>El corcho está vacío</h2>
    <p>Tocá <b>+ Nueva nota</b>, escribile al bot de Telegram, o mandale un audio. Queda clavado acá.</p>
  </div>
  <div class="canvas-controls">
    <button id="zoomOut" title="Alejar">−</button>
    <span class="zoom-label" id="zoomLabel">100%</span>
    <button id="zoomIn" title="Acercar">+</button>
    <button class="center-btn" id="centerBtn" title="Centrar vista">Centrar</button>
  </div>
</main>

<div class="overlay" id="editOverlay">
  <div class="sheet">
    <h2 id="editTitle">Nueva nota</h2>
    <label>Título (opcional)</label>
    <input class="field" id="titleInput" placeholder="Ponele un nombre…" />
    <label>Nota</label>
    <textarea id="bodyInput" placeholder="Pegá o escribí lo que quieras guardar…"></textarea>
    <label>Etiquetas (opcional)</label>
    <input class="field" id="tagsInput" placeholder="ej: idea, cliente, inspiración" />
    <label>Color del papel</label>
    <div class="swatchrow" id="colorRow"></div>
    <label>Recordatorio (opcional)</label>
    <input class="field" type="datetime-local" id="reminderInput" />
    <div class="row">
      <button class="btn ghost" id="cancelEdit">Cancelar</button>
      <button class="btn accent" id="saveEdit">Clavar en el corcho</button>
    </div>
  </div>
</div>

<div class="overlay" id="detailOverlay">
  <div class="sheet detail" id="detailContent"></div>
</div>

<input type="file" id="importFile" accept="application/json" style="display:none" />
<div class="toast" id="toast"></div>

<script src="/app.js"></script>
</body>
</html>
