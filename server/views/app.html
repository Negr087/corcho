<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>corcho — mis notas</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2B241C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="corcho">
<link rel="icon" type="image/png" href="/logocorcho.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F2EA; --paper2:#F4EDDC; --ink:#2B241C; --ink2:#4A4136;
    --mut:#6F655A; --mut2:#A2988C; --accent:#D97A3F; --accent-dk:#7C4A20;
    --cork:#c9a26b;
    --serif:"Cormorant Garamond",Georgia,serif;
    --sans:"Inter",system-ui,sans-serif;
    --hand:"Caveat",cursive;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:var(--sans); color:var(--ink);
    background:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,.10), transparent 40%),
      repeating-radial-gradient(circle at 50% 50%, rgba(90,60,30,.05) 0 2px, transparent 2px 4px),
      var(--cork);
    height:100%; display:flex; flex-direction:column; overflow:hidden;
  }
  header{
    display:flex; align-items:center; gap:20px; flex-wrap:wrap; flex-shrink:0;
    padding:22px 30px; background:rgba(43,36,28,.10); backdrop-filter:blur(4px);
    border-bottom:1px solid rgba(43,36,28,.14); position:relative; z-index:20;
  }
  .brand{display:flex; flex-direction:column; line-height:1}
  .brand h1{font-family:var(--serif); font-weight:700; font-size:30px; color:var(--ink); letter-spacing:.01em}
  .brand span{font-family:var(--hand); font-size:18px; color:var(--accent-dk); margin-top:2px}
  .spacer{flex:1}
  .search{
    display:flex; align-items:center; gap:8px; background:var(--paper);
    border:1px solid rgba(43,36,28,.16); border-radius:999px; padding:9px 16px; min-width:220px;
    box-shadow:rgba(70,55,30,.06) 0 2px 10px;
  }
  .search input{border:0; outline:0; background:transparent; font-family:var(--sans); font-size:14px; color:var(--ink); width:100%}
  .search svg{width:15px;height:15px;color:var(--mut)}
  button{font-family:var(--sans); cursor:pointer; border:0}
  .btn{
    background:var(--ink); color:var(--paper); font-weight:600; font-size:13.5px;
    border-radius:12px; padding:11px 18px; box-shadow:rgba(70,52,28,.22) 0 6px 18px; transition:transform .15s, background .2s;
  }
  .btn:hover{transform:translateY(-1px)}
  .btn.ghost{background:var(--paper); color:var(--ink); box-shadow:rgba(70,55,30,.06) 0 2px 10px}
  .btn.accent{background:var(--accent)}
  main{position:relative; flex:1; overflow:hidden}
  .count{
    position:absolute; top:16px; left:20px; z-index:10; pointer-events:none;
    font-family:var(--hand); font-size:18px; color:var(--ink);
    background:rgba(246,242,234,.85); padding:3px 14px; border-radius:999px;
  }
  .canvas-viewport{position:absolute; inset:0; overflow:hidden; cursor:grab; touch-action:none}
  .canvas-viewport.panning{cursor:grabbing}
  .canvas-world{position:absolute; top:0; left:0; width:0; height:0}
  .empty{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px; color:rgba(43,36,28,.65); pointer-events:none}
  .empty h2{font-family:var(--serif); font-size:34px; margin-bottom:8px; color:var(--ink)}
  .empty p{font-size:15px; max-width:420px; margin:0 auto}
  .canvas-controls{
    position:absolute; bottom:20px; right:20px; z-index:15; display:flex; align-items:center; gap:6px;
    background:var(--paper); border-radius:999px; padding:6px; box-shadow:rgba(70,55,30,.18) 0 4px 16px;
  }
  .canvas-controls button{width:30px; height:30px; border-radius:50%; background:var(--ink); color:var(--paper); font-size:16px; display:grid; place-items:center}
  .canvas-controls button:hover{background:var(--accent-dk)}
  .canvas-controls .zoom-label{font-size:12px; color:var(--mut); min-width:36px; text-align:center}
  .canvas-controls .center-btn{width:auto; padding:0 14px; border-radius:999px; font-size:12px; font-weight:600}
  .card{
    position:absolute; width:240px; border-radius:10px; padding:20px 18px 16px;
    box-shadow:rgba(70,52,28,.20) 0 14px 34px, rgba(70,55,30,.10) 0 2px 8px;
    cursor:grab; transition:box-shadow .18s; touch-action:none; user-select:none;
  }
  .card:hover{box-shadow:rgba(70,52,28,.28) 0 22px 50px}
  .card.dragging{cursor:grabbing; z-index:50; box-shadow:rgba(70,52,28,.35) 0 26px 60px}
  .pin{
    position:absolute; top:-9px; left:50%; transform:translateX(-50%);
    width:18px; height:18px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ff9d6b, var(--accent) 55%, var(--accent-dk));
    box-shadow:rgba(120,80,40,.35) 0 4px 8px, inset rgba(255,255,255,.5) 0 1px 1px;
  }
  .card h3{font-family:var(--serif); font-weight:600; font-size:22px; line-height:1.2; color:var(--ink); margin-bottom:8px}
  .card .body{font-size:14px; line-height:1.5; color:var(--ink2); white-space:pre-wrap; word-break:break-word;
    display:-webkit-box; -webkit-line-clamp:7; -webkit-box-orient:vertical; overflow:hidden}
  .card .tags{margin-top:12px; font-family:var(--hand); font-size:16px; color:var(--accent-dk)}
  .card .reminder{margin-top:8px; font-size:11.5px; font-weight:600; color:var(--accent-dk)}
  .card .date{margin-top:8px; font-size:10.5px; color:var(--mut2); letter-spacing:.04em; display:flex; align-items:center; gap:5px}
  .card .del{
    position:absolute; top:10px; right:10px; width:24px; height:24px; border-radius:50%;
    background:transparent; color:var(--mut2); font-size:16px; line-height:1; opacity:0; transition:opacity .2s;
    display:grid; place-items:center;
  }
  .card:hover .del{opacity:1}
  .card .del:hover{background:rgba(43,36,28,.10); color:var(--ink)}
  .card .check{
    position:absolute; top:10px; left:10px; width:22px; height:22px; border-radius:50%;
    border:2px solid rgba(43,36,28,.3); background:rgba(255,255,255,.35); cursor:pointer;
    display:grid; place-items:center; font-size:13px; color:transparent; transition:all .15s;
  }
  .card .check:hover{border-color:var(--accent-dk)}
  .card.done .check{background:var(--accent); border-color:var(--accent-dk); color:#fff}
  .card.done{opacity:.6}
  .card.done h3{text-decoration:line-through}
  .card .thumb{
    width:100%; max-height:120px; object-fit:cover; border-radius:8px; margin-bottom:10px;
    display:block; background:rgba(43,36,28,.08);
  }
  .overlay{position:fixed; inset:0; background:rgba(43,36,28,.5); backdrop-filter:blur(3px); z-index:40; display:none; align-items:center; justify-content:center; padding:20px}
  .overlay.open{display:flex}
  .sheet{
    background:var(--paper); border-radius:18px; width:100%; max-width:560px; max-height:88vh; overflow:auto;
    padding:26px; box-shadow:rgba(70,52,28,.35) 0 30px 80px;
  }
  .sheet h2{font-family:var(--serif); font-weight:700; font-size:26px; margin-bottom:16px}
  label{display:block; font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--mut); margin:14px 0 6px}
  textarea,.field{
    width:100%; font-family:var(--sans); font-size:14px; color:var(--ink);
    background:#fff; border:1px solid rgba(43,36,28,.18); border-radius:12px; padding:12px; outline:0;
  }
  textarea{min-height:200px; resize:vertical; line-height:1.55}
  textarea:focus,.field:focus{border-color:var(--accent)}
  .swatchrow{display:flex; gap:8px; margin-top:6px; flex-wrap:wrap}
  .swatchrow span{width:26px; height:26px; border-radius:50%; cursor:pointer; border:2px solid transparent; transition:transform .12s}
  .swatchrow span:hover{transform:scale(1.12)}
  .swatchrow span.sel{border-color:var(--ink)}
  .row{display:flex; gap:10px; margin-top:22px}
  .row .btn{flex:1; text-align:center}
  .detail .body-full{font-size:15px; line-height:1.6; color:var(--ink2); white-space:pre-wrap; word-break:break-word; margin-bottom:4px}
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:999px; font-size:13px;
    opacity:0; transition:all .3s; z-index:60; pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  a{color:var(--accent-dk)}
  .user{display:flex; align-items:center; gap:8px}
  .user img{width:30px; height:30px; border-radius:50%; object-fit:cover; border:1px solid rgba(43,36,28,.16)}
  .user span{font-size:13px; font-weight:600; color:var(--ink)}
  .user a{font-size:12.5px; color:var(--mut); text-decoration:none; border-bottom:1px dotted var(--mut)}
  .user a:hover{color:var(--ink)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>🧷 corcho</h1>
    <span>mis notas, clavadas acá</span>
  </div>
  <div class="spacer"></div>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="search" placeholder="Buscar en mis notas…" />
  </div>
  <button class="btn ghost" id="exportBtn">Backup</button>
  <button class="btn accent" id="addBtn">+ Nueva nota</button>
  <div class="user" id="userBox" style="display:none">
    <img id="userAvatar" alt="">
    <span id="userName"></span>
    <a href="/logout" id="logoutLink" title="Cerrar sesión">Salir</a>
  </div>
</header>

<main>
  <div class="count" id="count"></div>
  <div class="canvas-viewport" id="viewport">
    <div class="canvas-world" id="world"></div>
  </div>
  <div class="empty" id="emptyState" style="display:none">
    <h2>El corcho está vacío</h2>
    <p>Tocá <b>+ Nueva nota</b>, escribile al bot de Telegram, o mandale un audio. Queda clavado acá.</p>
  </div>
  <div class="canvas-controls">
    <button id="zoomOut" title="Alejar">−</button>
    <span class="zoom-label" id="zoomLabel">100%</span>
    <button id="zoomIn" title="Acercar">+</button>
    <button class="center-btn" id="centerBtn" title="Centrar vista">Centrar</button>
  </div>
</main>

<div class="overlay" id="editOverlay">
  <div class="sheet">
    <h2 id="editTitle">Nueva nota</h2>
    <label>Título (opcional)</label>
    <input class="field" id="titleInput" placeholder="Ponele un nombre…" />
    <label>Nota</label>
    <textarea id="bodyInput" placeholder="Pegá o escribí lo que quieras guardar…"></textarea>
    <label>Etiquetas (opcional)</label>
    <input class="field" id="tagsInput" placeholder="ej: idea, cliente, inspiración" />
    <label>Color del papel</label>
    <div class="swatchrow" id="colorRow"></div>
    <label>Recordatorio (opcional)</label>
    <input class="field" type="datetime-local" id="reminderInput" />
    <div class="row">
      <button class="btn ghost" id="cancelEdit">Cancelar</button>
      <button class="btn accent" id="saveEdit">Clavar en el corcho</button>
    </div>
  </div>
</div>

<div class="overlay" id="detailOverlay">
  <div class="sheet detail" id="detailContent"></div>
</div>

<input type="file" id="importFile" accept="application/json" style="display:none" />
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const COLORS = [
  "#F4EDDC","#ECD3CD","#CFD3BD","#CFC6E0","#F7C99B","#F6F2EA",
  "#BFD8D2","#F5B8B0","#FFE29A","#B8CDE0","#D9B8D4","#C9B79C","#A8C3A0","#E8A87C"
];
let notes = [];
let editingId = null;
let pickedColor = COLORS[0];
let pendingPos = null;
let lastDragUndo = null;

// --- estado del lienzo (pan/zoom) ---
let pan = { x: 0, y: 0 };
let zoom = 1;
const MIN_ZOOM = 0.2, MAX_ZOOM = 2.5;
let isPanning = false, panStart = null;
let interacting = false;

function applyTransform(){
  $("#world").style.transform = `translate(${pan.x}px, ${pan.y}px) scale(${zoom})`;
  $("#zoomLabel").textContent = Math.round(zoom * 100) + "%";
}
function screenToWorld(sx, sy){ return { x: (sx - pan.x) / zoom, y: (sy - pan.y) / zoom }; }
function setZoomAt(cx, cy, newZoom){
  newZoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, newZoom));
  const pt = screenToWorld(cx, cy);
  zoom = newZoom;
  pan.x = cx - pt.x * zoom;
  pan.y = cy - pt.y * zoom;
  applyTransform();
  scheduleSaveView();
}
function fitAll(){
  const rect = $("#viewport").getBoundingClientRect();
  if(!notes.length){ zoom = 1; pan.x = rect.width/2; pan.y = rect.height/2; applyTransform(); saveView(); return; }
  const xs = notes.map(n=>n.x ?? 0), ys = notes.map(n=>n.y ?? 0);
  const minX = Math.min(...xs) - 150, maxX = Math.max(...xs) + 150;
  const minY = Math.min(...ys) - 150, maxY = Math.max(...ys) + 150;
  const w = Math.max(1, maxX - minX), h = Math.max(1, maxY - minY);
  zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, Math.min(rect.width / w, rect.height / h)));
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  pan.x = rect.width / 2 - cx * zoom;
  pan.y = rect.height / 2 - cy * zoom;
  applyTransform();
  saveView();
}

// --- persistencia de la vista (pan/zoom) entre visitas ---
const VIEW_KEY = "corcho.view.v1";
let saveViewTimer = null;
function saveView(){
  try { localStorage.setItem(VIEW_KEY, JSON.stringify({ x: pan.x, y: pan.y, zoom })); } catch(e){}
}
function scheduleSaveView(){
  clearTimeout(saveViewTimer);
  saveViewTimer = setTimeout(saveView, 400);
}
function loadSavedView(){
  try {
    const v = JSON.parse(localStorage.getItem(VIEW_KEY));
    if (v && typeof v.x === "number" && typeof v.y === "number" && typeof v.zoom === "number") return v;
  } catch(e){}
  return null;
}
function initView(){
  const saved = loadSavedView();
  if (saved){
    pan.x = saved.x; pan.y = saved.y; zoom = saved.zoom;
    applyTransform();
  } else {
    const rect = $("#viewport").getBoundingClientRect();
    zoom = 1; pan.x = rect.width/2; pan.y = rect.height/2;
    applyTransform();
    saveView();
  }
}

function checkAuth(res){
  if (res.status === 401){ location.href = "/login"; throw new Error("no autenticado"); }
  return res;
}
async function loadMe(){
  const r = await fetch("/api/me");
  if (r.status === 401){ location.href = "/login"; return; }
  const me = await r.json();
  $("#userAvatar").src = me.picture || "";
  $("#userName").textContent = me.name || me.email;
  $("#userBox").style.display = "flex";
}
async function loadNotes(){
  const r = checkAuth(await fetch("/api/notes"));
  notes = await r.json();
}
async function apiCreate(note){
  const r = checkAuth(await fetch("/api/notes", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(note) }));
  return r.json();
}
async function apiUpdate(id, note){
  const r = checkAuth(await fetch("/api/notes/"+encodeURIComponent(id), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(note) }));
  return r.json();
}
async function apiDelete(id){
  checkAuth(await fetch("/api/notes/"+encodeURIComponent(id), { method:"DELETE" }));
}
async function apiPosition(id, x, y){
  await fetch("/api/notes/"+encodeURIComponent(id)+"/position", {
    method:"PATCH", headers:{"Content-Type":"application/json"}, body:JSON.stringify({x, y})
  }).catch(()=>{});
}
async function apiDone(id, done){
  await fetch("/api/notes/"+encodeURIComponent(id)+"/done", {
    method:"PATCH", headers:{"Content-Type":"application/json"}, body:JSON.stringify({done})
  }).catch(()=>{});
}
async function apiReminder(id, remindAt){
  await fetch("/api/notes/"+encodeURIComponent(id)+"/reminder", {
    method:"PATCH", headers:{"Content-Type":"application/json"}, body:JSON.stringify({remindAt})
  }).catch(()=>{});
}
function toDatetimeLocal(ts){
  if(!ts) return "";
  const d = new Date(ts);
  const pad = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fdatetime(ts){
  try{ return new Date(ts).toLocaleString("es-AR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; }
}

function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1600); }
function rot(id){ let h=0; for(const c of id) h=(h*31+c.charCodeAt(0))%1000; return ((h%7)-3); }
function esc(s){ return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fdate(ts){ try{ return new Date(ts).toLocaleDateString("es-AR",{day:"2-digit",month:"short",year:"numeric"}); }catch(e){ return ""; } }
function linkify(s){ return esc(s).replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>'); }
function srcBadge(n){
  if(n.source==="telegram") return "💬 ";
  if(n.source==="telegram-audio") return "🎙️ ";
  return "";
}

function anyOverlayOpen(){
  return $("#editOverlay").classList.contains("open") || $("#detailOverlay").classList.contains("open");
}

function createCardEl(n){
  const el = document.createElement("div");
  el.className = "card" + (n.done ? " done" : "");
  el.dataset.id = n.id;
  el.style.background = n.color || COLORS[0];
  el.style.left = (n.x ?? 0) + "px";
  el.style.top = (n.y ?? 0) + "px";
  el.style.transform = `translate(-50%,-50%) rotate(${rot(n.id)}deg)`;
  el.innerHTML = `
    <div class="pin"></div>
    <button class="del" data-del="${n.id}" title="Sacar del corcho">×</button>
    <button class="check" data-done="${n.id}" title="Marcar como hecha">✓</button>
    ${n.image_path?`<img class="thumb" src="/media/${n.id}" alt="">`:""}
    ${n.title?`<h3>${esc(n.title)}</h3>`:""}
    <div class="body">${esc(n.body)}</div>
    ${n.tags?`<div class="tags">${esc(n.tags)}</div>`:""}
    ${n.remind_at && !n.reminded?`<div class="reminder">⏰ ${fdatetime(n.remind_at)}</div>`:""}
    <div class="date">${srcBadge(n)}${fdate(n.created)}</div>
  `;
  el.addEventListener("pointerdown", (e) => onCardPointerDown(e, n, el));
  return el;
}

function onCardPointerDown(e, note, el){
  if (e.target.closest(".del") || e.target.closest(".check")) return;
  if (e.pointerType === "mouse" && e.button !== 0) return;
  e.stopPropagation();
  const startX = e.clientX, startY = e.clientY;
  const startLeft = note.x ?? 0, startTop = note.y ?? 0;
  let moved = false;
  interacting = true;
  el.setPointerCapture(e.pointerId);

  function onMove(ev){
    const dx = (ev.clientX - startX) / zoom;
    const dy = (ev.clientY - startY) / zoom;
    if (!moved && Math.hypot(ev.clientX - startX, ev.clientY - startY) > 4){
      moved = true;
      el.classList.add("dragging");
    }
    if (moved){
      el.style.left = (startLeft + dx) + "px";
      el.style.top = (startTop + dy) + "px";
    }
  }
  function onUp(ev){
    el.removeEventListener("pointermove", onMove);
    el.removeEventListener("pointerup", onUp);
    el.removeEventListener("pointercancel", onUp);
    el.classList.remove("dragging");
    interacting = false;
    if (moved){
      const dx = (ev.clientX - startX) / zoom;
      const dy = (ev.clientY - startY) / zoom;
      const newX = Math.round(startLeft + dx), newY = Math.round(startTop + dy);
      lastDragUndo = { id: note.id, prevX: startLeft, prevY: startTop };
      note.x = newX; note.y = newY;
      apiPosition(note.id, newX, newY);
    } else {
      openDetail(note);
    }
  }
  el.addEventListener("pointermove", onMove);
  el.addEventListener("pointerup", onUp);
  el.addEventListener("pointercancel", onUp);
}

function render(){
  const world = $("#world");
  world.innerHTML = "";
  if (!notes.length){
    $("#emptyState").style.display = "flex";
  } else {
    $("#emptyState").style.display = "none";
    notes.forEach(n => world.appendChild(createCardEl(n)));
  }
  applySearchFilter();
}

function applySearchFilter(){
  const q = $("#search").value.trim().toLowerCase();
  const cards = $("#world").querySelectorAll(".card");
  let matches = 0;
  cards.forEach(el => {
    const n = notes.find(x => x.id === el.dataset.id);
    const isMatch = !n || !q || (n.title+" "+n.body+" "+n.tags).toLowerCase().includes(q);
    el.style.opacity = isMatch ? "1" : "0.2";
    el.style.pointerEvents = isMatch ? "auto" : "none";
    if (isMatch) matches++;
  });
  $("#count").textContent = notes.length
    ? `${notes.length} nota${notes.length>1?"s":""}` + (q ? ` · ${matches} coinciden` : "")
    : "";
}

function focusFirstMatch(){
  const q = $("#search").value.trim().toLowerCase();
  if (!q) return;
  const match = notes.find(n => (n.title+" "+n.body+" "+n.tags).toLowerCase().includes(q));
  if (!match){ toast("Sin resultados"); return; }
  const rect = $("#viewport").getBoundingClientRect();
  zoom = Math.max(zoom, 0.8);
  pan.x = rect.width/2 - (match.x ?? 0) * zoom;
  pan.y = rect.height/2 - (match.y ?? 0) * zoom;
  applyTransform();
  saveView();
}

function openEditor(note){
  editingId = note ? note.id : null;
  pickedColor = note ? (note.color||COLORS[0]) : COLORS[0];
  if (!note){
    const rect = $("#viewport").getBoundingClientRect();
    const center = screenToWorld(rect.width/2, rect.height/2);
    pendingPos = { x: Math.round(center.x + (Math.random()-0.5)*80), y: Math.round(center.y + (Math.random()-0.5)*80) };
  }
  $("#editTitle").textContent = note ? "Editar nota" : "Nueva nota";
  $("#titleInput").value = note ? note.title : "";
  $("#bodyInput").value = note ? note.body : "";
  $("#tagsInput").value = note ? note.tags : "";
  $("#reminderInput").value = note ? toDatetimeLocal(note.remind_at) : "";
  $("#colorRow").innerHTML = COLORS.map(c=>`<span data-c="${c}" style="background:${c}" class="${c===pickedColor?'sel':''}"></span>`).join("");
  $("#editOverlay").classList.add("open");
  setTimeout(()=>$("#bodyInput").focus(),50);
}

function openDetail(n){
  $("#detailContent").innerHTML=`
    ${n.image_path?`<img src="/media/${n.id}" style="width:100%;border-radius:12px;margin-bottom:14px;display:block">`:""}
    ${n.title?`<h2>${esc(n.title)}</h2>`:""}
    <div class="body-full">${linkify(n.body)}</div>
    ${n.tags?`<div style="font-family:var(--hand);font-size:18px;color:var(--accent-dk);margin-top:10px">${esc(n.tags)}</div>`:""}
    ${n.remind_at?`<div style="font-size:13px;font-weight:600;color:var(--accent-dk);margin-top:10px">⏰ ${fdatetime(n.remind_at)}${n.reminded?" (ya avisado)":""}</div>`:""}
    <div style="font-size:11px;color:var(--mut);margin-top:8px">${srcBadge(n)}${fdate(n.created)}</div>
    <div class="row">
      <button class="btn ghost" data-toggledone="${n.id}">${n.done?"Marcar pendiente":"Marcar hecha"}</button>
      <button class="btn ghost" data-edit="${n.id}">Editar</button>
      <button class="btn ghost" data-copy="${n.id}">Copiar</button>
      ${n.remind_at?`<button class="btn ghost" data-clearreminder="${n.id}">Quitar recordatorio</button>`:""}
      <button class="btn ghost" data-delfull="${n.id}" style="color:#a33">Eliminar</button>
      <button class="btn" data-close>Cerrar</button>
    </div>`;
  $("#detailOverlay").classList.add("open");
}

$("#addBtn").onclick=()=>openEditor(null);
$("#cancelEdit").onclick=()=>$("#editOverlay").classList.remove("open");
$("#colorRow").onclick=(e)=>{ const s=e.target.closest("[data-c]"); if(!s)return; pickedColor=s.dataset.c; [...$("#colorRow").children].forEach(x=>x.classList.toggle("sel",x.dataset.c===pickedColor)); };
$("#saveEdit").onclick=async ()=>{
  const title=$("#titleInput").value.trim();
  const body=$("#bodyInput").value.trim();
  const tags=$("#tagsInput").value.trim();
  const reminderVal=$("#reminderInput").value;
  const remindAt = reminderVal ? new Date(reminderVal).getTime() : null;
  if(!body && !title){ toast("Escribí algo primero"); return; }
  let id = editingId;
  if(editingId){
    await apiUpdate(editingId, { title, body, tags, color:pickedColor });
  }else{
    const created = await apiCreate({ title, body, tags, color:pickedColor, x: pendingPos.x, y: pendingPos.y });
    id = created.id;
  }
  await apiReminder(id, remindAt);
  await loadNotes(); render();
  $("#editOverlay").classList.remove("open");
  toast(editingId?"Nota actualizada ✓":"Clavada en el corcho ✓");
  editingId=null;
};
$("#search").oninput = applySearchFilter;
$("#search").addEventListener("keydown", (e) => { if (e.key === "Enter") focusFirstMatch(); });
$("#world").addEventListener("click", async (e) => {
  const del = e.target.closest("[data-del]");
  if (del){
    e.stopPropagation();
    if (confirm("¿Sacar esta nota del corcho?")){
      await apiDelete(del.dataset.del);
      notes = notes.filter(n => n.id !== del.dataset.del);
      render();
    }
    return;
  }
  const doneBtn = e.target.closest("[data-done]");
  if (doneBtn){
    e.stopPropagation();
    const n = notes.find(x => x.id === doneBtn.dataset.done);
    if (n){
      n.done = n.done ? 0 : 1;
      await apiDone(n.id, !!n.done);
      render();
    }
  }
});
$("#detailOverlay").onclick=async (e)=>{
  if(e.target.id==="detailOverlay"||e.target.hasAttribute("data-close")){ $("#detailOverlay").classList.remove("open"); return; }
  const ed=e.target.closest("[data-edit]"); if(ed){ const n=notes.find(x=>x.id===ed.dataset.edit); $("#detailOverlay").classList.remove("open"); openEditor(n); return; }
  const cp=e.target.closest("[data-copy]"); if(cp){ const n=notes.find(x=>x.id===cp.dataset.copy); navigator.clipboard.writeText((n.title?n.title+"\n\n":"")+n.body); toast("Copiado"); return; }
  const td=e.target.closest("[data-toggledone]"); if(td){ const n=notes.find(x=>x.id===td.dataset.toggledone); if(n){ n.done = n.done?0:1; await apiDone(n.id, !!n.done); $("#detailOverlay").classList.remove("open"); render(); } return; }
  const cr=e.target.closest("[data-clearreminder]"); if(cr){ const n=notes.find(x=>x.id===cr.dataset.clearreminder); if(n){ n.remind_at=null; await apiReminder(n.id, null); $("#detailOverlay").classList.remove("open"); render(); } return; }
  const df=e.target.closest("[data-delfull]"); if(df){ if(confirm("¿Eliminar esta nota?")){ await apiDelete(df.dataset.delfull); await loadNotes(); render(); $("#detailOverlay").classList.remove("open"); } }
};
$("#editOverlay").onclick=(e)=>{ if(e.target.id==="editOverlay") $("#editOverlay").classList.remove("open"); };
$("#exportBtn").onclick=()=>{
  if(!notes.length){ toast("No hay nada para exportar"); return; }
  const blob=new Blob([JSON.stringify(notes,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="corcho-backup-"+new Date().toISOString().slice(0,10)+".json"; a.click();
  toast("Backup descargado");
};
$("#exportBtn").oncontextmenu=(e)=>{ e.preventDefault(); $("#importFile").click(); };
$("#importFile").onchange=(e)=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=async ()=>{
    try{
      const d=JSON.parse(r.result);
      if(Array.isArray(d)){
        for(const n of d){ await apiCreate({ title:n.title||"", body:n.body||"", tags:n.tags||"", color:n.color||COLORS[0], x:n.x, y:n.y }); }
        await loadNotes(); render();
        toast("Backup importado");
      }
    }catch(err){ toast("Archivo inválido"); }
  };
  r.readAsText(f);
};
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ document.querySelectorAll(".overlay.open").forEach(o=>o.classList.remove("open")); }
  if((e.ctrlKey||e.metaKey)&&e.key==="Enter"&&$("#editOverlay").classList.contains("open")){ $("#saveEdit").click(); }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"&&!anyOverlayOpen()&&lastDragUndo){
    e.preventDefault();
    const { id, prevX, prevY } = lastDragUndo;
    const n = notes.find(x=>x.id===id);
    if(n){ n.x=prevX; n.y=prevY; apiPosition(id, prevX, prevY); render(); toast("Movimiento deshecho"); }
    lastDragUndo = null;
  }
});

// --- pan y zoom del lienzo ---
const viewport = $("#viewport");
viewport.addEventListener("pointerdown", (e) => {
  if (e.target.closest(".card")) return;
  if (e.pointerType === "mouse" && e.button !== 0) return;
  isPanning = true; interacting = true;
  viewport.classList.add("panning");
  viewport.setPointerCapture(e.pointerId);
  panStart = { clientX:e.clientX, clientY:e.clientY, panX:pan.x, panY:pan.y };
});
viewport.addEventListener("pointermove", (e) => {
  if (!isPanning || !panStart) return;
  pan.x = panStart.panX + (e.clientX - panStart.clientX);
  pan.y = panStart.panY + (e.clientY - panStart.clientY);
  applyTransform();
});
function endPan(){ if(isPanning){ isPanning=false; interacting=false; viewport.classList.remove("panning"); panStart=null; saveView(); } }
viewport.addEventListener("pointerup", endPan);
viewport.addEventListener("pointercancel", endPan);
viewport.addEventListener("wheel", (e) => {
  e.preventDefault();
  const rect = viewport.getBoundingClientRect();
  const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
  if (e.ctrlKey){
    setZoomAt(cx, cy, zoom * Math.exp(-e.deltaY * 0.01));
  } else {
    pan.x -= e.deltaX; pan.y -= e.deltaY;
    applyTransform();
    scheduleSaveView();
  }
}, { passive:false });
$("#zoomIn").onclick = () => { const r=viewport.getBoundingClientRect(); setZoomAt(r.width/2, r.height/2, zoom*1.25); };
$("#zoomOut").onclick = () => { const r=viewport.getBoundingClientRect(); setZoomAt(r.width/2, r.height/2, zoom/1.25); };
$("#centerBtn").onclick = () => fitAll();

setInterval(async ()=>{
  if(anyOverlayOpen() || interacting) return;
  try{ await loadNotes(); render(); }catch(e){}
}, 15000);

loadMe();
loadNotes().then(() => { initView(); render(); });

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(()=>{}));
}
</script>
</body>
</html>
