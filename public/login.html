<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>corcho — iniciar sesión</title>
<link rel="icon" type="image/png" href="/logocorcho.png">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F2EA; --ink:#2B241C; --ink2:#4A4136; --mut:#6F655A;
    --accent:#D97A3F; --accent-dk:#7C4A20; --cork:#c9a26b;
    --serif:"Cormorant Garamond",Georgia,serif; --sans:"Inter",system-ui,sans-serif; --hand:"Caveat",cursive;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:var(--sans); color:var(--ink); display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,.10), transparent 40%),
      repeating-radial-gradient(circle at 50% 50%, rgba(90,60,30,.05) 0 2px, transparent 2px 4px),
      var(--cork);
  }
  .card{
    background:var(--paper); border-radius:18px; padding:40px 36px; max-width:360px; width:100%; text-align:center;
    box-shadow:rgba(70,52,28,.35) 0 30px 80px;
  }
  img.logo{width:64px; height:64px; border-radius:16px; object-fit:cover; margin-bottom:14px}
  h1{font-family:var(--serif); font-weight:700; font-size:28px}
  p.sub{font-family:var(--hand); font-size:17px; color:var(--accent-dk); margin-top:2px; margin-bottom:26px}
  .error{background:#f6dede; color:#a33; font-size:13px; padding:10px 14px; border-radius:10px; margin-bottom:18px}
  a.google-btn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    background:var(--ink); color:var(--paper); font-weight:600; font-size:14px;
    border-radius:12px; padding:13px 18px; text-decoration:none; box-shadow:rgba(70,52,28,.22) 0 6px 18px;
    transition:transform .15s;
  }
  a.google-btn:hover{transform:translateY(-1px)}
  a.google-btn svg{width:18px; height:18px}
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/logocorcho.png" alt="corcho">
    <h1>corcho</h1>
    <p class="sub">mis notas, clavadas acá</p>
    <div id="errorBox" class="error" style="display:none"></div>
    <a class="google-btn" href="/auth/google">
      <svg viewBox="0 0 24 24"><path fill="#fff" d="M21.35 11.1h-9.17v2.73h6.51c-.33 3.81-3.5 5.44-6.5 5.44C8.36 19.27 5 16.25 5 12c0-4.1 3.2-7.27 7.2-7.27 3.09 0 4.9 1.97 4.9 1.97L19 4.72S16.56 2 12.1 2C6.42 2 2.03 6.8 2.03 12c0 5.05 4.13 10 10.22 10 5.35 0 9.25-3.67 9.25-9.09 0-1.15-.15-1.81-.15-1.81Z"/></svg>
      Continuar con Google
    </a>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    if (params.get("error") === "not-allowed") {
      const box = document.getElementById("errorBox");
      box.textContent = "Esa cuenta de Google no está autorizada para usar este corcho.";
      box.style.display = "block";
    }
  </script>
</body>
</html>
